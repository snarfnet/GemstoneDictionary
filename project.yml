name: GemstoneDictionary
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 83VGKGSQUH

targets:
  GemstoneDictionary:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - GemstoneDictionary
    settings:
      base:
        PRODUCT_NAME: GemstoneDictionary
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.gemstonedictionary
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: GemstoneDictionary/Resources/Info.plist
    info:
      path: GemstoneDictionary/Resources/Info.plist
      properties:
        CFBundleDisplayName: "天然石辞典"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.reference
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "天然石を撮影して、色や透明度の目安を表示するために使います。"
        NSPhotoLibraryUsageDescription: "写真から天然石を調べるために使います。"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Light
    scheme:
      testTargets:
        - GemstoneDictionaryUITests
  GemstoneDictionaryUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - GemstoneDictionaryUITests
    dependencies:
      - target: GemstoneDictionary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.gemstonedictionary.uitests
        TEST_TARGET_NAME: GemstoneDictionary
